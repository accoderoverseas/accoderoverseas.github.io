# ============================================================
#  站点基本信息
# ============================================================
title: 码上出海 Coding Overseas
description: 求职 OA/VO × 留学生 CS 课程 · 北美 / 澳洲 / 欧洲 / 亚洲 · 在职工程师本人 1v1 交付
lang: zh-CN

# 目录式永久链接：所有页面输出为 /路径/名称/（带斜杠），与站内链接统一
permalink: pretty

# ============================================================
#  主题：用 remote_theme 让 GitHub 云端构建，本地无需安装任何东西
#  想锁定版本更稳可改成： just-the-docs/just-the-docs@v0.10.1
# ============================================================
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

# ============================================================
#  just-the-docs 功能开关
# ============================================================
search_enabled: true      # 开启全站搜索
heading_anchors: true      # 标题自动生成锚点
color_scheme: light        # 配色（light / dark）

# 右上角 / 页脚辅助链接
aux_links:
  "内容仓库 GitHub":
    - "https://github.com/accoderoverseas/intern-ng-oavo-coding-2027"
aux_links_new_tab: true

# 代码高亮 + 目录树由主题自动处理
