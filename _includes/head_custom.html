<!-- 中英文切换开关 + 站内文案国际化（默认中文） -->
<!-- 注意：本主题会压缩 HTML（去掉换行），脚本内一律用块注释 /* */，禁止使用 // 行注释，否则整段会被当成注释 -->
<style>
  /* 双语内容块：默认显示中文，开关开启时显示英文 */
  .i18n-en { display: none; }
  html.lang-en .i18n-zh { display: none; }
  html.lang-en .i18n-en { display: block; }

  /* 顶部右侧的分段式语言开关 */
  .i18n-toggle {
    display: inline-flex; align-items: stretch;
    height: 26px; padding: 0; margin-left: .5rem;
    border: 1px solid #d0cfe0; border-radius: 999px; overflow: hidden;
    background: #fff; cursor: pointer; user-select: none;
    font-size: 12px; line-height: 1; font-family: inherit;
  }
  .i18n-toggle .i18n-opt {
    display: flex; align-items: center; padding: 0 11px;
    color: #5c5962; font-weight: 600; letter-spacing: .02em;
    transition: background-color .15s ease, color .15s ease;
  }
  .i18n-toggle .i18n-opt[data-l="zh"] { background: #7253ed; color: #fff; }
  html.lang-en .i18n-toggle .i18n-opt[data-l="zh"] { background: transparent; color: #5c5962; }
  html.lang-en .i18n-toggle .i18n-opt[data-l="en"] { background: #7253ed; color: #fff; }

  .i18n-toggle--float { position: fixed; top: 9px; right: 14px; z-index: 1000; }

  /* 去掉左下角「This site uses Just the Docs…」页脚文本 */
  .site-footer { display: none !important; }

  /* 水印的「无 JS」兜底：JS 正常时会给 <html> 加 .wm-js 使其让位给自愈水印，避免叠加变深 */
  html:not(.wm-js)::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 2147483600;
    background-repeat: repeat; background-position: 0 0;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27210%27%20height%3D%27134%27%3E%3Ctext%20x%3D%27105%27%20y%3D%27100%27%20transform%3D%27rotate%2830%20105%2067%29%27%20text-anchor%3D%27middle%27%20font-family%3D%27Arial%2C%20Helvetica%2C%20sans-serif%27%20font-size%3D%2720%27%20fill%3D%27%23868b93%27%20fill-opacity%3D%270.20%27%3Eby%3A%20ac_coder_tutor%3C%2Ftext%3E%3C%2Fsvg%3E");
  }
</style>

<script>
  (function () {
    /* 尽早根据本地记忆设置语言，避免刷新时中英文闪烁 */
    try { if (localStorage.getItem('site-lang') === 'en') document.documentElement.classList.add('lang-en'); } catch (e) {}

    /* 按导航项的中文文案匹配（比 href 稳妥：当前页的导航项没有 href；子项如题名/公司名不在表内故不翻译） */
    var NAV = {
      '首页': 'Home',
      '算法每日一题': 'Daily Problem',
      '求职找工OA/VO真题拆解': 'OA/VO Problem Breakdowns',
      '算法数据结构知识点速查': 'DSA Quick Reference',
      '留学生CS课程': 'CS Courses (Study Abroad)',
      'CS课程速查': 'CS Course Quick Reference',
      '学校课程图谱': 'University Course Map',
      '联系我': 'Contact'
    };
    var SEARCH_PH = { zh: 'Search', en: 'Search' };

    function apply(lang) {
      document.documentElement.classList.toggle('lang-en', lang === 'en');
      var links = document.querySelectorAll('.site-nav .nav-list-link[data-en]');
      for (var i = 0; i < links.length; i++) {
        links[i].textContent = (lang === 'en') ? links[i].getAttribute('data-en') : links[i].getAttribute('data-zh');
      }
      var si = document.getElementById('search-input');
      if (si) si.setAttribute('placeholder', SEARCH_PH[lang]);
      try { localStorage.setItem('site-lang', lang); } catch (e) {}
    }

    function init() {
      /* 记录每个导航项的中文原文，供来回切换 */
      var navLinks = document.querySelectorAll('.site-nav .nav-list-link');
      for (var i = 0; i < navLinks.length; i++) {
        var a = navLinks[i];
        var label = a.textContent.trim();
        if (NAV[label] && !a.hasAttribute('data-en')) {
          a.setAttribute('data-zh', label);
          a.setAttribute('data-en', NAV[label]);
        }
      }

      /* 构建开关 */
      var tog = document.createElement('button');
      tog.type = 'button';
      tog.className = 'i18n-toggle';
      tog.setAttribute('aria-label', '切换语言 / Toggle language');
      tog.innerHTML = '<span class="i18n-opt" data-l="zh">中</span><span class="i18n-opt" data-l="en">EN</span>';
      tog.addEventListener('click', function () {
        apply(document.documentElement.classList.contains('lang-en') ? 'zh' : 'en');
      });

      var auxList = document.querySelector('.aux-nav .aux-nav-list');
      if (auxList) {
        var li = document.createElement('li');
        li.className = 'aux-nav-list-item';
        li.appendChild(tog);
        auxList.appendChild(li);
      } else {
        var host = document.querySelector('.aux-nav') || document.querySelector('.site-header') || document.body;
        tog.classList.add('i18n-toggle--float');
        host.appendChild(tog);
      }

      var saved = 'zh';
      try { if (localStorage.getItem('site-lang') === 'en') saved = 'en'; } catch (e) {}
      apply(saved);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>

<script>
  (function () {
    /* 全站防伪水印：左上→右下、约 30° 倾斜、浅灰高透明、平铺；不拦截点击；自愈守卫防篡改 */
    /* 说明：纯前端水印无法做到绝对不可篡改（用户可禁用 JS 等），此处用自愈方式让删除/改样式后立即恢复，抵御常规手段 */
    var TXT = 'by: ac_coder_tutor';

    function svgUrl() {
      var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='210' height='134'>"
        + "<text x='105' y='100' transform='rotate(30 105 67)' text-anchor='middle' "
        + "font-family='Arial, Helvetica, sans-serif' font-size='20' fill='#868b93' fill-opacity='0.20'>"
        + TXT + "</text></svg>";
      return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
    }

    /* 目标样式（每条都加 !important，抵抗覆盖）；固定视口、极高层级、穿透点击 */
    var CSS = ('position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;'
      + 'margin:0;padding:0;border:0;pointer-events:none;user-select:none;'
      + 'z-index:2147483600;opacity:1;display:block;visibility:visible;'
      + 'background-repeat:repeat;background-position:0 0;background-image:' + svgUrl() + ';')
      .replace(/;/g, ' !important;');

    var mark = null;
    var attrObserver = null;

    function build() {
      mark = document.createElement('div');
      mark.setAttribute('aria-hidden', 'true');
      mark.style.cssText = CSS;
      (document.body || document.documentElement).appendChild(mark);
      /* 盯住这一水印节点自身的属性改动，被改立刻恢复 */
      try {
        if (attrObserver) attrObserver.disconnect();
        attrObserver = new MutationObserver(function () { ensure(); });
        attrObserver.observe(mark, { attributes: true, attributeFilter: ['style', 'class'] });
      } catch (e) {}
    }

    function ensure() {
      /* 保持 .wm-js，让 CSS 兜底水印让位，避免叠加 */
      var de = document.documentElement;
      if (de && !de.classList.contains('wm-js')) de.classList.add('wm-js');
      /* 被删除 / 未挂载 → 重建 */
      if (!mark || !mark.isConnected) { build(); return; }
      /* 关键样式被改（隐藏、透明、层级、点击穿透、定位、背景被清） → 整体恢复 */
      var s = mark.style;
      if (s.display === 'none' || s.visibility === 'hidden'
          || s.opacity !== '1' || s.position !== 'fixed'
          || s.pointerEvents !== 'none'
          || (s.backgroundImage || '').indexOf('svg') === -1
          || (s.cssText || '').indexOf('2147483600') === -1) {
        s.cssText = CSS;
      }
    }

    function start() {
      /* 标记 JS 生效：让位 CSS 兜底水印，改用可自愈的覆盖层 */
      try { document.documentElement.classList.add('wm-js'); } catch (e) {}
      build();
      try {
        /* 盯住整棵树的增删，水印被移除时重建 */
        var mo = new MutationObserver(function () { ensure(); });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}
      /* 兜底轮询，防止 observer 被移除/绕过 */
      setInterval(ensure, 700);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
