<text class="eyebrow" x="70" y="72">MONASH UNIVERSITY · 2026 · COURSE CONTENT MAP</text>
<text class="title" x="70" y="145">算法 · 数据结构 · 理论</text>
<text class="subtitle" x="70" y="202">把问题变成模型：先实现与分析，再用形式化语言界定边界</text>
<path class="rule" d="M70 232Q470 246 980 232" stroke="#7253ed"/>
<rect class="core" x="365" y="275" width="770" height="125" rx="32"/>
<text class="core-label" x="750" y="320">MONASH · 5 门课学习路线</text>
<text class="core-text" x="750" y="370">数据结构 × 算法设计 × 计算理论</text>
<g transform="translate(70 430)"><rect class="panel" width="660" height="340" rx="34" stroke="#3f7d54"/><path class="accent" d="M40 4H210" stroke="#3f7d54"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#3f7d54">STEP 1</text><text class="code" x="40" y="66" fill="#3f7d54">FIT1008 · FUNDAMENTALS OF ALGORITHMS</text><text class="head" x="40" y="116">入门·打地基</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">递归与复杂度分析 (Big-O)</tspan><tspan x="40" dy="44">栈 / 队列 / 树 / 堆 / 哈希表</tspan><tspan x="40" dy="44">时间空间权衡与测试</tspan></text><text class="pnote" x="40" y="312">⚠ 后续课直接先修，建议并修 MAT1830</text></g>
<g transform="translate(770 430)"><rect class="panel" width="660" height="340" rx="34" stroke="#3f7d54"/><path class="accent" d="M40 4H210" stroke="#3f7d54"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#3f7d54">STEP 1′</text><text class="code" x="40" y="66" fill="#3f7d54">FIT2085 · ALGORITHMS FOR ENGINEERS</text><text class="head" x="40" y="116">FIT1008 工程版</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">递归、入门复杂度分析</tspan><tspan x="40" dy="44">栈 / 队列 / 树 / 堆 / 哈希表</tspan><tspan x="40" dy="44">算法性能评估与实现</tspan></text><text class="pnote" x="40" y="312">⚠ 工程学院等价版，多动手实现</text></g>
<g transform="translate(70 814)"><rect class="panel" width="660" height="340" rx="34" stroke="#2769ae"/><path class="accent" d="M40 4H210" stroke="#2769ae"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#2769ae">STEP 2</text><text class="code" x="40" y="66" fill="#2769ae">FIT2004 · ALGORITHMS &amp; DATA STRUCTURES</text><text class="head" x="40" y="116">主干硬课</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">复杂度分析（最好/均/坏）</tspan><tspan x="40" dy="44">高级数据结构：堆、B 树</tspan><tspan x="40" dy="44">排序、搜索、图算法</tspan></text><text class="pnote" x="40" y="312">⚠ 图算法最易翻车，按周实现别攒期末</text></g>
<g transform="translate(770 814)"><rect class="panel" width="660" height="340" rx="34" stroke="#7253ed"/><path class="accent" d="M40 4H210" stroke="#7253ed"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#7253ed">STEP 3</text><text class="code" x="40" y="66" fill="#7253ed">FIT2014 · THEORY OF COMPUTATION</text><text class="head" x="40" y="116">形式化与可计算</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">自动机、正则、文法</tspan><tspan x="40" dy="44">图灵机、P 与 NP、NP 完全</tspan><tspan x="40" dy="44">形式化证明写作</tspan></text><text class="pnote" x="40" y="312">⚠ 偏数学要写证明，先固 MAT1830</text></g>
<g transform="translate(420 1198)"><rect class="panel" width="660" height="340" rx="34" stroke="#c67b38"/><path class="accent" d="M40 4H210" stroke="#c67b38"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#c67b38">STEP 4</text><text class="code" x="40" y="66" fill="#c67b38">FIT3155 · ADVANCED ALGORITHMS</text><text class="head" x="40" y="116">难度天花板</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●●</text><text class="bullet" x="40" y="166"><tspan x="40">摊还分析 (amortized)</tspan><tspan x="40" dy="44">字符串算法（后缀树/数组、Z）</tspan><tspan x="40" dy="44">新型树/图、数论算法</tspan></text><text class="pnote" x="40" y="312">⚠ 先学扎实 FIT2004，期末占 60%</text></g>
<text class="watermark" x="750" y="1600">https://accoderoverseas.github.io</text>
<rect class="focus" x="70" y="1640" width="1360" height="150" rx="32"/>
<text class="focus-label" x="110" y="1685">学习主线</text>
<text class="focus-text" x="750" y="1743">FIT1008 / FIT2085 → FIT2004 → FIT2014（理论）/ FIT3155（进阶）</text>
<text class="note" x="750" y="1858">递归与复杂度是一切地基；图算法、字符串算法务必动手实现，别攒到期末</text>
<text class="tiny" x="750" y="1930">CLAYTON CAMPUS · SECOND SEMESTER · 2026 S2</text>
