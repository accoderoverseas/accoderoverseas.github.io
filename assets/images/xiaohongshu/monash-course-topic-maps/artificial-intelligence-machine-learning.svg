<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2369" viewBox="0 0 1500 2369">
<defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#d9d2c5" stroke-width="2" stroke-dasharray="4 8"/></pattern></defs>
<style><![CDATA[svg{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.bg{fill:#fbf8f2}.grid{opacity:.5}.eyebrow{font-size:24px;font-weight:700;fill:#687378;letter-spacing:3px}.title{font-size:54px;font-weight:800;fill:#172126}.subtitle{font-size:31px;font-weight:600;fill:#59656a}.rule{fill:none;stroke-width:8;stroke-linecap:round}.core{fill:#eaf1ef;stroke:#247b75;stroke-width:4}.core-label{font-size:25px;font-weight:800;fill:#247b75;letter-spacing:3px;text-anchor:middle}.core-text{font-size:36px;font-weight:800;fill:#1f2b2e;text-anchor:middle}.panel{fill:#fffdfa;stroke-width:4}.accent{stroke-width:9;stroke-linecap:round}.code{font-size:23px;font-weight:800;letter-spacing:1px}.head{font-size:31px;font-weight:800;fill:#182226}.dots{font-size:26px;font-weight:800;text-anchor:end}.bullet{font-size:27px;font-weight:570;fill:#293337}.pnote{font-size:24px;font-weight:700;fill:#b3603a}.ordertag{font-size:20px;font-weight:800;letter-spacing:2px}.focus{fill:#f2efe7;stroke:#b68b39;stroke-width:4}.focus-label{font-size:24px;font-weight:800;fill:#9a7025;letter-spacing:2px}.focus-text{font-size:30px;font-weight:650;fill:#303638;text-anchor:middle}.note{font-size:26px;font-weight:600;fill:#5e696d;text-anchor:middle}.watermark{font-size:34px;font-weight:600;fill:#9ba1a2;letter-spacing:1px;text-anchor:middle}.tiny{font-size:20px;font-weight:600;fill:#838b8d;letter-spacing:2px;text-anchor:middle}]]></style>
<rect class="bg" width="1500" height="2369"/><rect class="grid" width="1500" height="2369" fill="url(#grid)"/>
<text class="eyebrow" x="70" y="72">MONASH UNIVERSITY · 2026 · COURSE CONTENT MAP</text>
<text class="title" x="70" y="145">人工智能 · 机器学习</text>
<text class="subtitle" x="70" y="202">从看懂 AI，到理解模型背后的数学，再做出可解释的 AI 方案</text>
<path class="rule" d="M70 232Q470 246 980 232" stroke="#7253ed"/>
<rect class="core" x="365" y="275" width="770" height="125" rx="32"/>
<text class="core-label" x="750" y="320">MONASH · 7 门课学习路线</text>
<text class="core-text" x="750" y="370">AI 基础 × 机器学习 × 深度学习/NLP</text>
<g transform="translate(70 430)"><rect class="panel" width="660" height="340" rx="34" stroke="#3f7d54"/><path class="accent" d="M40 4H210" stroke="#3f7d54"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#3f7d54">STEP 1</text><text class="code" x="40" y="66" fill="#3f7d54">FIT1059 · AI FOR EVERYONE</text><text class="head" x="40" y="116">零门槛通识</text><text class="dots" x="626" y="116" fill="#c99a2e">●○○○○</text><text class="bullet" x="40" y="166"><tspan x="40">AI 概念与发展史</tspan><tspan x="40" dy="44">机器学习直觉、生成式 AI (LLM)</tspan><tspan x="40" dy="44">AI 伦理与社会影响</tspan></text><text class="pnote" x="40" y="312">⚠ 无需代码/数学，重在讲清 + 反思</text></g>
<g transform="translate(770 430)"><rect class="panel" width="660" height="340" rx="34" stroke="#2769ae"/><path class="accent" d="M40 4H210" stroke="#2769ae"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#2769ae">STEP 2</text><text class="code" x="40" y="66" fill="#2769ae">FIT3080 · ARTIFICIAL INTELLIGENCE</text><text class="head" x="40" y="116">本科主干·符号 AI</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">智能体与搜索 (A*/minimax)</tspan><tspan x="40" dy="44">逻辑推理、贝叶斯网络</tspan><tspan x="40" dy="44">经典 ML（决策树/朴素贝叶斯）</tspan></text><text class="pnote" x="40" y="312">⚠ 期末 3h10m 占 60%，作业动手实现</text></g>
<g transform="translate(70 814)"><rect class="panel" width="660" height="340" rx="34" stroke="#247b75"/><path class="accent" d="M40 4H210" stroke="#247b75"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#247b75">STEP 2′</text><text class="code" x="40" y="66" fill="#247b75">FIT5047 · FUNDAMENTALS OF AI</text><text class="head" x="40" y="116">研究生版 AI 基础</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">搜索、知识表示与规划</tspan><tspan x="40" dy="44">不确定性推理（贝叶斯）</tspan><tspan x="40" dy="44">监督/无监督 ML、进化算法</tspan></text><text class="pnote" x="40" y="312">⚠ 默认快上手概率/逻辑，实验是核心</text></g>
<g transform="translate(770 814)"><rect class="panel" width="660" height="340" rx="34" stroke="#7253ed"/><path class="accent" d="M40 4H210" stroke="#7253ed"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#7253ed">STEP 3</text><text class="code" x="40" y="66" fill="#7253ed">FIT5201 · MACHINE LEARNING</text><text class="head" x="40" y="116">最吃数学的硬课</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●●</text><text class="bullet" x="40" y="166"><tspan x="40">偏差-方差、模型选择</tspan><tspan x="40" dy="44">线性/逻辑回归、生成 vs 判别</tspan><tspan x="40" dy="44">K-means、GMM、EM、神经网络</tspan></text><text class="pnote" x="40" y="312">⚠ 线代+概率+微积分，开学前必补</text></g>
<g transform="translate(70 1198)"><rect class="panel" width="660" height="340" rx="34" stroke="#c67b38"/><path class="accent" d="M40 4H210" stroke="#c67b38"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#c67b38">STEP 4</text><text class="code" x="40" y="66" fill="#c67b38">FIT5215 · DEEP LEARNING</text><text class="head" x="40" y="116">深度学习实战</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">深度网络、CNN、RNN</tspan><tspan x="40" dy="44">优化训练策略</tspan><tspan x="40" dy="44">表示学习、嵌入、时序建模</tspan></text><text class="pnote" x="40" y="312">⚠ 先练熟 PyTorch，提前跑通环境</text></g>
<g transform="translate(770 1198)"><rect class="panel" width="660" height="340" rx="34" stroke="#c67b38"/><path class="accent" d="M40 4H210" stroke="#c67b38"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#c67b38">STEP 4′</text><text class="code" x="40" y="66" fill="#c67b38">FIT5217 · NATURAL LANGUAGE PROCESSING</text><text class="head" x="40" y="116">NLP · 大模型基础</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">词 / 句 / 篇章分析</tspan><tspan x="40" dy="44">信息抽取、问答系统</tspan><tspan x="40" dy="44">NLP 系统设计与评估</tspan></text><text class="pnote" x="40" y="312">⚠ 需概率+ML/DL 底子，期末占 60%</text></g>
<g transform="translate(420 1582)"><rect class="panel" width="660" height="340" rx="34" stroke="#b3543f"/><path class="accent" d="M40 4H210" stroke="#b3543f"/><text class="ordertag" x="626" y="40" text-anchor="end" fill="#b3543f">STEP 5</text><text class="code" x="40" y="66" fill="#b3543f">FIT5226 · MULTI-AGENT SYSTEMS</text><text class="head" x="40" y="116">多智能体·进阶</text><text class="dots" x="626" y="116" fill="#c99a2e">●●●●○</text><text class="bullet" x="40" y="166"><tspan x="40">强化学习、Deep Q-Learning</tspan><tspan x="40" dy="44">博弈论、群体动力学</tspan><tspan x="40" dy="44">群体机器人、集体行为</tspan></text><text class="pnote" x="40" y="312">⚠ RL 抽象，核心项目分阶段别攒</text></g>
<text class="watermark" x="750" y="1984">https://accoderoverseas.github.io</text>
<rect class="focus" x="70" y="2024" width="1360" height="150" rx="32"/>
<text class="focus-label" x="110" y="2069">学习主线</text>
<text class="focus-text" x="750" y="2127">FIT1059 → FIT3080 / FIT5047 → FIT5201 → FIT5215 / FIT5217 → FIT5226</text>
<text class="note" x="750" y="2242">数学（概率/线代）是 ML/DL 命脉；别只调包——能画数据流、写清指标、解释失败样例才算懂</text>
<text class="tiny" x="750" y="2314">CLAYTON CAMPUS · SECOND SEMESTER · 2026 S2</text>
</svg>
