  # ============================================================
  #  GitHub Actions 构建 Jekyll 站点 —— 保底方案
  #
  #  何时用：默认走 Settings → Pages → “Deploy from a branch”（经典构建）即可。
  #  若经典构建出问题，把 Settings → Pages → Source 改成 “GitHub Actions”，
  #  本 workflow 就会自动接管构建与部署（用完整可见的构建日志）。
  #
  #  注意：Source 还停留在 “branch” 时，本 workflow 在 push 后也会触发，
  #  但最后 deploy 步骤会因 Pages 未设为 Actions 而失败——这是预期的，
  #  切换 Source 到 “GitHub Actions” 后即恢复正常。
  # ============================================================
  name: Build and deploy Jekyll site to Pages

  on:
    push:
      branches: [main]
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: pages
    cancel-in-progress: false

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            ruby-version: "3.3"
            bundler-cache: true
        - name: Configure Pages
          id: pages
          uses: actions/configure-pages@v5
        - name: Build with Jekyll
          run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          env:
            JEKYLL_ENV: production
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3

    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
